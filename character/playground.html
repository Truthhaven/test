<title>Character Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* Layout: one tall stage with the character, a dock of reaction buttons and a speed slider underneath */
:root{
  --bg:#f7efe6; --stage-a:#ffe1bd; --stage-b:#f4c99a; --fg:#2a1a14; --muted:#7a5b4c;
  --accent:#c4561f; --chip:#fff8f1; --chip-line:#e7cdb6; --shadow:rgba(80,30,10,.18);
  --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", sans-serif;
  --speed:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1210; --stage-a:#3a2419; --stage-b:#241612; --fg:#f6e7da; --muted:#c3a594;
  --accent:#f08a43; --chip:#2b1c16; --chip-line:#4a3126; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1210; --stage-a:#3a2419; --stage-b:#241612; --fg:#f6e7da; --muted:#c3a594;
  --accent:#f08a43; --chip:#2b1c16; --chip-line:#4a3126; --shadow:rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.stage{position:relative;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 80% at 25% 20%,var(--stage-a),var(--stage-b));
  display:flex;justify-content:center;align-items:flex-end;padding-top:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stage svg{display:block;width:auto;height:min(64vh,620px);max-width:100%;overflow:visible}
.floor{position:absolute;left:50%;bottom:10px;width:46%;height:22px;transform:translateX(-50%);
  background:radial-gradient(closest-side,var(--shadow),transparent);pointer-events:none}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dock button{font:600 .95rem var(--body);color:var(--fg);background:var(--chip);border:1px solid var(--chip-line);
  border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dock button small{font-weight:400;color:var(--muted);font-size:.72rem}
.dock button:active{transform:scale(.97)}
.dock button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.speed{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted)}
.speed input{flex:1;accent-color:var(--accent);min-width:0}
.speed output{font-variant-numeric:tabular-nums;width:3.2em;text-align:right;color:var(--fg)}

/* ---------- character animation ---------- */
#figure{transform-origin:510px 1440px}
.idle #torso,.idle #arm-left,.idle #arm-right{animation:breathe calc(3.6s/var(--speed)) ease-in-out infinite}
.idle #head{animation:tilt calc(5s/var(--speed)) ease-in-out infinite}
.idle #eyelid-left,.idle #eyelid-right{animation:blinkLoop calc(4.5s/var(--speed)) infinite}
.do-blink #eyelid-left,.do-blink #eyelid-right{animation:blink calc(.28s/var(--speed)) ease-in-out 2}
.do-hop #figure{animation:hop calc(.7s/var(--speed)) cubic-bezier(.3,.7,.4,1)}
.do-nod #head{animation:nod calc(.5s/var(--speed)) ease-in-out 2}
.do-sway #figure{animation:sway calc(1.2s/var(--speed)) ease-in-out 2}
.do-sway #head{animation:swayHead calc(1.2s/var(--speed)) ease-in-out 2}
.do-shimmy #arm-left,.do-shimmy #arm-right,.do-shimmy #torso{animation:shimT calc(.3s/var(--speed)) ease-in-out 6}
.do-shimmy #head{animation:shimH calc(.3s/var(--speed)) ease-in-out 6}
.paused *{animation-play-state:paused!important}

@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tilt{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
@keyframes blinkLoop{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes blink{0%,100%{transform:scaleY(0)}50%{transform:scaleY(1)}}
@keyframes hop{0%{transform:translateY(0) scaleY(1)}15%{transform:translateY(0) scale(1.03,.95)}
  45%{transform:translateY(-70px) scale(.98,1.03)}75%{transform:translateY(0) scale(1.03,.96)}100%{transform:translateY(0) scale(1)}}
@keyframes flapL{0%,100%{transform:rotate(0)}45%{transform:rotate(7deg)}}
@keyframes flapR{0%,100%{transform:rotate(0)}45%{transform:rotate(-7deg)}}
@keyframes nod{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(4deg) translateY(6px)}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes swayHead{0%,100%{transform:rotate(0)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
@keyframes shimL{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-5px) rotate(3deg)}}
@keyframes shimR{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(5px) rotate(-3deg)}}
@keyframes shimT{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@keyframes shimH{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(3px) rotate(1deg)}}
@media (prefers-reduced-motion: reduce){.idle *{animation:none!important}}
</style>

  </div>
  <div class="dock" role="group" aria-label="Moves">
    <button id="b-hop" data-move="hop">Hop<small>jump</small></button>
    <button id="b-nod" data-move="nod">Nod<small>yes</small></button>
    <button id="b-blink" data-move="blink">Blink<small>double</small></button>
    <button id="b-sway" data-move="sway">Sway<small>side to side</small></button>
    <button id="b-shimmy" data-move="shimmy">Shimmy<small>dance</small></button>
    <button id="b-idle" aria-pressed="true">Idle<small>on</small></button>
  </div>
  <label class="speed" for="speed">Speed
    <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1">
    <output id="speedOut" for="speed">1&times;</output>
  </label>
</div>
<script>
const stage=document.getElementById('stage'), moves=['hop','nod','blink','sway','shimmy'];
let busy=null;
function play(m){
  moves.forEach(x=>stage.classList.remove('do-'+x));
  void stage.offsetWidth;            // restart animation if the same move is tapped again
  stage.classList.add('do-'+m);
  clearTimeout(busy);
  const sp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--speed'))||1;
  busy=setTimeout(()=>stage.classList.remove('do-'+m),2600/sp);
}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.move)));
stage.addEventListener('click',()=>play(moves[Math.floor(Math.random()*moves.length)]));
const idleBtn=document.getElementById('b-idle');
idleBtn.addEventListener('click',()=>{
  const on=!stage.classList.toggle('idle')?false:true;
  idleBtn.setAttribute('aria-pressed',on); idleBtn.querySelector('small').textContent=on?'on':'off';
});
const speed=document.getElementById('speed'), out=document.getElementById('speedOut');
speed.addEventListener('input',()=>{document.documentElement.style.setProperty('--speed',speed.value);out.textContent=speed.value+'\u00d7'});
</script>
