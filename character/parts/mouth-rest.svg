    <!-- resting face: a closed, relaxed mouth painted over the smile (hidden unless a scene shows it) -->
    <g id="mouth-rest" opacity="0">
      <defs>
        <linearGradient id="mrSkin" x1="0" y1="0" x2="1" y2=".35">
          <stop offset="0" stop-color="#cd6226"/><stop offset=".45" stop-color="#d3672a"/><stop offset="1" stop-color="#d96d2a"/>
        </linearGradient>
        <filter id="mrSoft" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
      </defs>
      <!-- skin patch over the open smile and its cheek creases -->
      <ellipse cx="518" cy="192" rx="50" ry="21" transform="rotate(-9 518 192)" fill="url(#mrSkin)" filter="url(#mrSoft)"/>
      <ellipse cx="518" cy="192" rx="44" ry="17" transform="rotate(-9 518 192)" fill="url(#mrSkin)"/>
      <!-- soft shading under the lower lip -->
      <path d="M498 204 Q518 210 538 200 Q526 212 512 212 Q502 210 498 204 Z" fill="#b8521f" opacity=".45" filter="url(#mrSoft)"/>
      <!-- lips: relaxed and closed, tilted with her head -->
      <path d="M489 194 Q499 186 509 188 Q515 185 521 187 Q534 182 545 186 Q532 191 517 192 Q502 194 489 194 Z" fill="#8e3a1f"/>
      <path d="M490 194 Q517 194 544 187 Q539 199 519 203 Q500 205 490 194 Z" fill="#b14a2b"/>
      <path d="M503 198 Q516 200 530 195" fill="none" stroke="#d9805e" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
      <path d="M489 194 Q517 194 545 186" fill="none" stroke="#5a1d0c" stroke-width="1.8" stroke-linecap="round"/>
    </g>
